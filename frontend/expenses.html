<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenses · Store Finance</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main">
      <header>
        <h1>Expenses</h1>
      </header>

      <div id="msg-box"></div>

      <div class="panel">
        <h3 id="form-title">Add Expense</h3>
        <form id="expense-form">
          <input type="hidden" id="expense-id" />
          <div class="form-row">
            <div class="field"><label>Category</label><input id="category" placeholder="Rent, Utilities, Salaries…" required /></div>
            <div class="field"><label>Amount</label><input id="amount" type="number" step="0.01" min="0" required /></div>
            <div class="field"><label>Date</label><input id="expense_date" type="date" required /></div>
            <div class="field"><label>Description</label><input id="description" /></div>
          </div>
          <button type="submit">Save Expense</button>
          <button type="button" class="secondary hidden" id="cancel-edit-btn">Cancel</button>
        </form>
      </div>

      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3>Expense History</h3>
          <button type="button" class="secondary" id="export-expenses-btn">Export CSV</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th></th></tr></thead>
            <tbody id="expenses-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/vendor/feather.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/expenses.js"></script>
</body>
</html>
