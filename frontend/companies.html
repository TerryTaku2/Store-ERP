<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Companies · T-Tech Connect</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main">
      <header>
        <h1>Companies</h1>
      </header>

      <div id="msg-box"></div>

      <div class="panel">
        <h3>New Company</h3>
        <form id="company-form">
          <div class="form-row">
            <div class="field"><label>Company name</label><input id="company-name" required /></div>
            <div class="field"><label>Admin username</label><input id="admin-username" required /></div>
            <div class="field"><label>Admin full name</label><input id="admin-full-name" required /></div>
            <div class="field"><label>Admin password</label><input id="admin-password" type="password" required /></div>
          </div>
          <button type="submit">Create Company</button>
        </form>
      </div>

      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3>All Companies</h3>
          <button type="button" class="secondary" id="export-companies-btn">Export CSV</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Status</th><th>Created</th><th></th></tr></thead>
            <tbody id="companies-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="company-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="margin:0;">Rename Business</h3>
        <button type="button" class="secondary" id="company-modal-close">Close</button>
      </div>
      <form id="company-modal-form">
        <div class="field"><label>Business name</label><input id="modal-company-name" required /></div>
        <button type="submit">Save</button>
      </form>
    </div>
  </div>

  <script src="/js/vendor/feather.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/companies.js"></script>
</body>
</html>
