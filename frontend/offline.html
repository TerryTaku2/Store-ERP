<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline · T-Tech Connect</title>
  <link rel="icon" href="/icons/favicon-32.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .box { max-width: 360px; }
    .icon {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .icon svg { width: 30px; height: 30px; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    p { font-size: 13.5px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
    button {
      background: #2563eb; color: #fff; border: none; border-radius: 7px;
      padding: 10px 20px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z"/>
        <path d="M5 13l2 2a7.07 7.07 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
        <path d="M9 17l2 2a2.83 2.83 0 0 1 2 0l2-2a5 5 0 0 0-6 0z"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>T-Tech Connect needs a connection to load your store's data. Check your signal or Wi-Fi and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
