<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Store Finance</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Store Financial Management</h1>
      <p class="subtitle">Sign in to continue</p>
      <div id="login-error" class="msg error hidden"></div>
      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit">Log in</button>
      </form>

      <p class="login-hint">
        Forgot your password? <a href="#" id="forgot-password-link">Get help</a>
      </p>
      <p class="login-hint hidden" id="forgot-password-msg">
        Contact your company administrator — they can reset your password for you from the Users page.
      </p>

      <div class="login-divider"><span>or</span></div>

      <button type="button" class="secondary" id="demo-login-btn" style="width:100%;">Try the Demo</button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
