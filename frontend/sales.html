<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales · T-Tech Connect</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main">
      <div id="msg-box"></div>

      <div class="pos-layout">
        <div class="pos-catalog">
          <div class="pos-catalog-header">
            <h1>Point of Sale</h1>
            <div class="subtitle" id="pos-subtitle"></div>
            <div style="display:flex;gap:10px;align-items:center;margin-top:16px;">
              <div class="search-box" style="flex:1;margin-top:0;margin-bottom:0;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input id="barcode-input" placeholder="Search by name, or scan/type barcode then Enter" autocomplete="off" />
              </div>
              <button type="button" class="secondary" id="camera-scan-btn" style="white-space:nowrap;">Scan with Camera</button>
            </div>
            <div class="pos-pills" id="category-pills"></div>
          </div>
          <div class="tile-grid" id="tile-grid"></div>
        </div>

        <div class="pos-cart">
          <div class="pos-cart-header"><h2>Current Sale</h2></div>
          <div class="pos-cart-fields">
            <div class="field"><label>Customer name (optional)</label><input id="customer_name" /></div>
          </div>
          <div class="pos-cart-items" id="cart-items"></div>
          <div class="pos-cart-totals">
            <div class="total-row grand"><span>Total</span><span id="cart-total">$0.00</span></div>
          </div>
          <div class="tender-row" id="tender-row"></div>
          <button type="button" class="checkout-btn" id="submit-sale-btn">Complete Sale</button>
          <div id="last-sale-box" style="padding:0 20px 16px;"></div>
        </div>
      </div>

      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3>Recent Sales</h3>
          <button type="button" class="secondary" id="export-sales-btn">Export CSV</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Invoice</th><th>Customer</th><th>Payment</th><th>Total</th><th>Date</th><th>Status</th><th></th></tr></thead>
            <tbody id="sales-body"></tbody>
          </table>
        </div>
        <div style="text-align:center;margin-top:12px;">
          <button type="button" class="secondary hidden" id="load-more-sales-btn">Load More</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="/js/vendor/feather.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/barcode-scanner.js"></script>
  <script src="/js/sales.js"></script>
</body>
</html>
