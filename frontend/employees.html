<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="T-Tech Connect" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employees · T-Tech Connect</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <div class="main">
      <header>
        <h1>Employees</h1>
      </header>
      <div class="card-sub" style="margin-bottom:16px;">
        HR and payroll records for staff at any branch — no system login needed. Payroll pays everyone listed here. To give someone app access too, link them to an employee from <a href="/users.html">User Management</a>.
      </div>

      <div id="msg-box"></div>

      <div class="panel">
        <h3 id="form-title">Add Employee</h3>
        <form id="employee-form">
          <input type="hidden" id="employee-id" />
          <div class="form-row">
            <div class="field"><label>Full Name</label><input id="full_name" required /></div>
            <div class="field"><label>Position <span style="font-weight:normal;">(optional)</span></label><input id="position" placeholder="e.g. Cashier, Cleaner" /></div>
            <div class="field">
              <label>Branch</label>
              <select id="branch_id" required></select>
            </div>
            <div class="field"><label>Phone <span style="font-weight:normal;">(optional)</span></label><input id="phone" /></div>
            <div class="field"><label>Base Salary</label><input id="base_salary" type="number" step="0.01" min="0" value="0" /></div>
          </div>
          <button type="submit">Save Employee</button>
          <button type="button" class="secondary hidden" id="cancel-edit-btn">Cancel</button>
        </form>
      </div>

      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3>All Employees</h3>
          <button type="button" class="secondary" id="export-employees-btn">Export CSV</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Full Name</th><th>Position</th><th>Branch</th><th>Base Salary</th><th>Status</th><th>System Access</th><th></th></tr></thead>
            <tbody id="employees-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/vendor/feather.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/employees.js"></script>
</body>
</html>
